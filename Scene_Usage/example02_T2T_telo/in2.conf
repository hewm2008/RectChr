
SetParaFor=global             	##设置全局范围(global)相关变量

File1=./recomb.rate.txt                 	##模拟重组率(cM/Mb), 500kb bins
File2=./centromere.txt                     	##端粒/着丝粒标记
File3=./SpeRegion.txt                     	##额外高亮区域
File4=./chrlist.txt                     	##chr length
track_num=3                             	##总绘图层数(track_num)为3
chr_spacing_ratio=-1.0                  	##3层叠加, -1.0后每条约留20单位间距
xaxis_shift_y=-30
canvas_margin_top=80


SetParaFor=trackALL
chr_label_shift_x=-10

SetParaFor=track1             	##重组率热图, 作为染色体主体
plot_type=heatmap
show_columns=File1:4
background_show=0
background_color="#FFFFFF"
bg_stroke_color="#FFFFFF"
bg_stroke_width=0
track_height=20
track_shift_y=0
padding_ratio=0.0
colormap_low_color="#FDD49E"            	##低重组率颜色
colormap_mid_color="#F16913"            	##中等重组率颜色
colormap_high_color="#7F0000"           	##高重组率(热点)颜色
colormap_nlevels=10
Ymin=0
Ymax=25
upper_outlier_ratio=1.0
lower_outlier_ratio=0
colormap_legend_sizeratio=1.0
stroke-width=0

SetParaFor=track2             	##端粒/着丝粒标记, 叠加在热图上
plot_type=shape
show_columns=File2:4
colormap_legend_sizeratio=1.0
track_geom_shape=20,15,14
track_point_size=8
colormap_low_color="#5307b0"
colormap_mid_color="#6509d6"
colormap_high_color="#6e09eb"
bg_stroke_color="#FFFFFF"
bg_stroke_width=0
background_color="#FFFFFF"
track_shift_y=-20
padding_ratio=0.0

SetParaFor=track3             	##额外区域高亮, 叠加在最上层
plot_type=highlights
show_columns=File3:4
colormap_low_color="#5307b0"
colormap_mid_color="#6509d6"
colormap_high_color="#6e09eb"
bg_stroke_color="#FFFFFF"
bg_stroke_width=0
background_color="#FFFFFF"
track_shift_y=-40
colormap_legend_show=0
stroke-width=0
